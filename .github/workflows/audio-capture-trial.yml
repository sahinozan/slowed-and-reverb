name: Audio capture trial

# Kept apart from the required "Lint, test, and package" check. The trial
# asks whether a hosted Ubuntu runner with a PulseAudio null sink can record
# the extension's audio in Chromium and Firefox; the regression suite
# records the engines through the changes that have gone wrong before. See
# e2e/audio-capture/README.md. Neither is required yet. Their failures stay
# visible; nothing here is allowed to fail quietly.

on:
  pull_request:
    paths:
      - '.github/workflows/audio-capture-trial.yml'
      - 'e2e/audio-capture/**'
      - 'e2e/extension-copy.js'
      # Both suites start Firefox through it.
      - 'e2e/firefox-launch.js'
      - 'extension/**'
      - 'package.json'
      - 'package-lock.json'
      # The suites' server reads its request targets with this.
      - 'scripts/request-target.js'
      - 'scripts/ci-package-downloads.sh'
      - 'scripts/ci-install-firefox.sh'
  workflow_dispatch:
    inputs:
      firefox:
        description: >-
          A Firefox release (such as 159.0) for the regression suite, from
          Mozilla's archive; empty for the runner's own Firefox
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Each finished run is evidence, so a newer run waits instead of cancelling.
concurrency:
  group: audio-capture-trial-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  linux-null-sink:
    name: Audio capture trial (Ubuntu, PulseAudio null sink)
    runs-on: ubuntu-latest
    # Every step below has its own deadline. Together (24 minutes to set up,
    # 2 to read Firefox's files, 5 for each browser, 1 to show the sound
    # server and 5 to upload) they come to 42, leaving 5 for the runner's
    # own work between them, so even a step that runs out of time leaves
    # time to upload the evidence. A hosted run took under 1 minute to set
    # up (tests/audio-workflow.test.js checks the sums).
    timeout-minutes: 47

    steps:
      - name: Check out repository
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        timeout-minutes: 2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install the pinned npm version
        timeout-minutes: 2
        run: npm install --global npm@11.19.0

      - name: Install exact dependencies
        timeout-minutes: 3
        run: npm ci

      - name: Download Ubuntu packages from Ubuntu's archive
        timeout-minutes: 1
        run: bash scripts/ci-package-downloads.sh

      - name: Read the Playwright version
        id: playwright
        timeout-minutes: 1
        shell: bash
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright Chromium
        id: playwright-cache
        timeout-minutes: 2
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # One of these two runs.
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 7
        run: npx playwright install --with-deps --no-shell chromium

      - name: Install Chromium's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 5
        run: npx playwright install-deps chromium

      # A virtual output device: both browsers play into it as into speakers.
      - name: Start a PulseAudio null sink
        id: sink
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio --version
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=audio_trial sink_properties=device.description=Audio_trial
          pactl set-default-sink audio_trial
          pactl info
          pactl list short sinks
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      # On GitHub's Ubuntu runners Firefox has sometimes not started within
      # 30 s, its main process waiting on the disk (in disk sleep, using no
      # CPU) when it was checked. Which file it waited for isn't known. As
      # an experiment, this reads Firefox's install once first, so it is in
      # memory, and logs how long the disk took. It can't stop the tests.
      - name: Read Firefox's files into memory
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          bin="${FIREFOX_BIN:-/usr/bin/firefox}"
          dir="$(dirname "$(readlink -f "$bin")")"
          if [[ ! -f "$dir/application.ini" ]]; then
            echo "::warning::No Firefox install beside $bin ($dir), so nothing was read."
            exit 0
          fi
          start=$(date +%s%N)
          bytes=$(find "$dir" -type f -print0 | xargs -0 cat | wc -c)
          echo "Read $bytes bytes of Firefox from $dir in $(( ($(date +%s%N) - start) / 1000000 )) ms."

      - name: Run the Chromium audio capture trial
        timeout-minutes: 5
        run: npm run test:audio-trial:chromium

      # Runs after a Chromium failure too, for its own evidence, once the
      # sink is there; either failure fails the job.
      - name: Run the Firefox audio capture trial
        if: ${{ !cancelled() && steps.sink.outputs.ready == 'true' }}
        timeout-minutes: 5
        run: npm run test:audio-trial:firefox

      - name: Show the sound server's state
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        shell: bash
        run: |
          pactl info || true
          pactl list short sinks || true
          pactl list short sink-inputs || true

      # Whatever happened before, even a cancelled run, keeps what it has.
      - name: Upload the trial's evidence
        if: ${{ always() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audio-capture-trial-linux
          path: test-results/audio-trial/
          if-no-files-found: warn
          retention-days: 14

  linux-regression:
    name: Audio regression suite (Ubuntu, PulseAudio null sink)
    runs-on: ubuntu-latest
    # Both browsers' suites take about 10 minutes together; installing the
    # sound server took up to 13 on its own from the Azure mirror, and well
    # under one from Ubuntu's archive. Every step below has its own
    # deadline. Together (24 minutes to set up, 3 to install a Firefox asked
    # for, 2 to read Firefox's files, 10 for each browser, 1 to show the
    # sound server and 5 to upload) they come to 55, leaving 5 for the
    # runner's own work between them, so even a step that runs out of time
    # leaves time to upload the evidence (tests/audio-workflow.test.js
    # checks the sums).
    timeout-minutes: 60

    steps:
      - name: Check out repository
        timeout-minutes: 1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        timeout-minutes: 2
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install the pinned npm version
        timeout-minutes: 2
        run: npm install --global npm@11.19.0

      - name: Install exact dependencies
        timeout-minutes: 3
        run: npm ci

      - name: Download Ubuntu packages from Ubuntu's archive
        timeout-minutes: 1
        run: bash scripts/ci-package-downloads.sh

      - name: Read the Playwright version
        id: playwright
        timeout-minutes: 1
        shell: bash
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright Chromium
        id: playwright-cache
        timeout-minutes: 2
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      # One of these two runs.
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 7
        run: npx playwright install --with-deps --no-shell chromium

      - name: Install Chromium's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 5
        run: npx playwright install-deps chromium

      # A virtual output device: both browsers play into it as into speakers.
      - name: Start a PulseAudio null sink
        id: sink
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio --version
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=audio_trial sink_properties=device.description=Audio_trial
          pactl set-default-sink audio_trial
          pactl info
          pactl list short sinks
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      # A run started by hand can ask for a Firefox release from Mozilla's
      # archive instead of the runner's own: the suite's baseline needs
      # Firefox's current and previous releases (e2e/audio-capture/BASELINE.md).
      # The script checks the download against Mozilla's release key and sets
      # FIREFOX_BIN for the steps after it. If it fails, the suites don't run.
      - name: Install the Firefox asked for
        if: ${{ inputs.firefox }}
        timeout-minutes: 3
        env:
          FIREFOX_VERSION: ${{ inputs.firefox }}
        run: bash scripts/ci-install-firefox.sh

      # On GitHub's Ubuntu runners Firefox has sometimes not started within
      # 30 s, its main process waiting on the disk (in disk sleep, using no
      # CPU) when it was checked. Which file it waited for isn't known. As
      # an experiment, this reads Firefox's install once first, so it is in
      # memory, and logs how long the disk took. It can't stop the tests.
      - name: Read Firefox's files into memory
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          bin="${FIREFOX_BIN:-/usr/bin/firefox}"
          dir="$(dirname "$(readlink -f "$bin")")"
          if [[ ! -f "$dir/application.ini" ]]; then
            echo "::warning::No Firefox install beside $bin ($dir), so nothing was read."
            exit 0
          fi
          start=$(date +%s%N)
          bytes=$(find "$dir" -type f -print0 | xargs -0 cat | wc -c)
          echo "Read $bytes bytes of Firefox from $dir in $(( ($(date +%s%N) - start) / 1000000 )) ms."

      - name: Run the Chromium audio regression suite
        timeout-minutes: 10
        run: npm run test:audio:chromium

      # Runs after a Chromium failure too, for its own evidence, once the
      # sink is there; either failure fails the job.
      - name: Run the Firefox audio regression suite
        if: ${{ !cancelled() && steps.sink.outputs.ready == 'true' }}
        timeout-minutes: 10
        run: npm run test:audio:firefox

      - name: Show the sound server's state
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        shell: bash
        run: |
          pactl info || true
          pactl list short sinks || true
          pactl list short sink-inputs || true

      # Whatever happened before, even a cancelled run, keeps what it has.
      - name: Upload the suite's evidence
        if: ${{ always() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audio-regression-linux
          path: test-results/audio-regression/
          if-no-files-found: warn
          retention-days: 14
