name: Audio capture trial

# Kept apart from the required "Lint, test, and package" check. The trial
# asks whether a hosted Ubuntu runner with a PulseAudio null sink can record
# the extension's audio in Chromium and Firefox; the regression suite
# records the engines through the changes that have gone wrong before. See
# e2e/audio-capture/README.md. Neither is required yet. Their failures stay
# visible; nothing here is allowed to fail quietly.

on:
  pull_request:
    paths:
      - '.github/workflows/audio-capture-trial.yml'
      - 'e2e/audio-capture/**'
      - 'e2e/extension-copy.js'
      - 'extension/**'
      - 'package.json'
      - 'package-lock.json'
      # The suites' server reads its request targets with this.
      - 'scripts/request-target.js'
      - 'scripts/ci-package-downloads.sh'
  workflow_dispatch:

permissions:
  contents: read

# Each finished run is evidence, so a newer run waits instead of cancelling.
concurrency:
  group: audio-capture-trial-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  linux-null-sink:
    name: Audio capture trial (Ubuntu, PulseAudio null sink)
    runs-on: ubuntu-latest
    # Every step below has its own deadline; together they leave time to
    # upload the evidence of a step that ran out of time.
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install the pinned npm version
        run: npm install --global npm@11.19.0

      - name: Install exact dependencies
        run: npm ci

      - name: Download Ubuntu packages from Ubuntu's archive
        timeout-minutes: 1
        run: bash scripts/ci-package-downloads.sh

      - name: Read the Playwright version
        id: playwright
        shell: bash
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: npx playwright install --with-deps --no-shell chromium

      - name: Install Chromium's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 10
        run: npx playwright install-deps chromium

      # A virtual output device: both browsers play into it as into speakers.
      - name: Start a PulseAudio null sink
        id: sink
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio --version
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=audio_trial sink_properties=device.description=Audio_trial
          pactl set-default-sink audio_trial
          pactl info
          pactl list short sinks
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Run the Chromium audio capture trial
        timeout-minutes: 5
        run: npm run test:audio-trial:chromium

      # Runs after a Chromium failure too, for its own evidence, once the
      # sink is there; either failure fails the job.
      - name: Run the Firefox audio capture trial
        if: ${{ !cancelled() && steps.sink.outputs.ready == 'true' }}
        timeout-minutes: 5
        run: npm run test:audio-trial:firefox

      - name: Show the sound server's state
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        shell: bash
        run: |
          pactl info || true
          pactl list short sinks || true
          pactl list short sink-inputs || true

      # Whatever happened before, even a cancelled run, keeps what it has.
      - name: Upload the trial's evidence
        if: ${{ always() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audio-capture-trial-linux
          path: test-results/audio-trial/
          if-no-files-found: warn
          retention-days: 14

  linux-regression:
    name: Audio regression suite (Ubuntu, PulseAudio null sink)
    runs-on: ubuntu-latest
    # Both browsers' suites take about 10 minutes together; installing the
    # sound server took up to 13 on its own from the Azure mirror. Every
    # step below has its own deadline; together they leave time to upload
    # the evidence of a step that ran out of time.
    timeout-minutes: 55

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install the pinned npm version
        run: npm install --global npm@11.19.0

      - name: Install exact dependencies
        run: npm ci

      - name: Download Ubuntu packages from Ubuntu's archive
        timeout-minutes: 1
        run: bash scripts/ci-package-downloads.sh

      - name: Read the Playwright version
        id: playwright
        shell: bash
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: npx playwright install --with-deps --no-shell chromium

      - name: Install Chromium's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 10
        run: npx playwright install-deps chromium

      # A virtual output device: both browsers play into it as into speakers.
      - name: Start a PulseAudio null sink
        id: sink
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio --version
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=audio_trial sink_properties=device.description=Audio_trial
          pactl set-default-sink audio_trial
          pactl info
          pactl list short sinks
          echo 'ready=true' >> "$GITHUB_OUTPUT"

      - name: Run the Chromium audio regression suite
        timeout-minutes: 10
        run: npm run test:audio:chromium

      # Runs after a Chromium failure too, for its own evidence, once the
      # sink is there; either failure fails the job.
      - name: Run the Firefox audio regression suite
        if: ${{ !cancelled() && steps.sink.outputs.ready == 'true' }}
        timeout-minutes: 10
        run: npm run test:audio:firefox

      - name: Show the sound server's state
        if: ${{ !cancelled() }}
        timeout-minutes: 1
        shell: bash
        run: |
          pactl info || true
          pactl list short sinks || true
          pactl list short sink-inputs || true

      # Whatever happened before, even a cancelled run, keeps what it has.
      - name: Upload the suite's evidence
        if: ${{ always() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audio-regression-linux
          path: test-results/audio-regression/
          if-no-files-found: warn
          retention-days: 14
