name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The repository checks run for every change. This job only decides whether
  # a change may skip the browser smoke tests, using the policy in the base
  # commit's scripts/classify-ci-changes.js rather than the pull request's own
  # copy. The workflow itself still comes from the pull request, so this keeps
  # a change from choosing its checks by accident; it isn't a security
  # boundary. Changing the workflow or the classifier runs every check.
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      browser: ${{ steps.changes.outputs.browser }}
      policy: ${{ steps.changes.outputs.policy }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0

      # tests/ci-workflow.test.js runs this script and the gate's in throwaway
      # repositories, so keep GitHub expressions out of them and pass values in env.
      - name: Classify changed paths
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          classifier=scripts/classify-ci-changes.js
          policy_copy="${RUNNER_TEMP:?}/ci-policy/classify-ci-changes.js"

          case "$EVENT_NAME" in
            pull_request) baseline="$BASE_SHA" range="$BASE_SHA...$HEAD_SHA" ;;
            push) baseline="$BEFORE_SHA" range="$BEFORE_SHA..$HEAD_SHA" ;;
            workflow_dispatch) baseline="" range="" ;;
            *) echo "::error::No classification for $EVENT_NAME events"; exit 1 ;;
          esac

          # Without a readable policy in the baseline, run everything.
          policy=none
          browser=true
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            policy=manual
          elif [[ -z "$baseline" ]] || ! git cat-file -e "$baseline^{commit}" 2>/dev/null; then
            echo "::notice::No baseline commit to compare with, so every check runs."
            if git cat-file -e "$HEAD_SHA^" 2>/dev/null; then git diff --check "$HEAD_SHA^" "$HEAD_SHA"; fi
          else
            git diff --check "$range"
            if ! git cat-file -e "$baseline:$classifier" 2>/dev/null; then
              echo "::notice::The baseline has no $classifier, so every check runs."
            else
              mkdir -p "$(dirname "$policy_copy")"
              git show "$baseline:$classifier" > "$policy_copy"
              version=$(node "$policy_copy" --policy-version < /dev/null)
              if [[ "$version" != 2 ]]; then
                echo "::notice::The baseline's $classifier has another policy format, so every check runs."
              else
                # --no-renames lists a renamed file's old path too.
                decision=$(git diff --no-renames --name-only -z "$range" | node "$policy_copy")
                case "$decision" in
                  browser=true | browser=false) policy=base browser="${decision#browser=}" ;;
                  *) echo "::error::The classifier printed something unexpected: $decision"; exit 1 ;;
                esac
              fi
            fi
          fi

          echo "Policy: $policy; browser smoke tests required: $browser"
          {
            echo "policy=$policy"
            echo "browser=$browser"
          } >> "$GITHUB_OUTPUT"

  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install the pinned npm version
        run: npm install --global npm@11.19.0

      - name: Verify tool versions
        run: |
          node --version
          npm --version

      - name: Install exact dependencies
        run: npm ci

      - name: Run all checks
        run: npm run check

  browser-smoke:
    name: Browser smoke (${{ matrix.os }})
    needs: classify
    if: needs.classify.outputs.browser == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install the pinned npm version
        run: npm install --global npm@11.19.0

      - name: Install exact dependencies
        run: npm ci

      # Unpacking Chromium takes minutes on Windows, so keep the download in
      # a cache keyed on the Playwright version; a bump downloads it again.
      - name: Read the Playwright version
        id: playwright
        shell: bash
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --no-shell chromium

      # The cache holds only the browser, so Linux still needs its libraries.
      - name: Install Chromium's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true' && runner.os == 'Linux'
        run: npx playwright install-deps chromium

      - name: Run extension browser smoke tests
        run: npm run test:e2e

      # Uses the Firefox already installed on GitHub's runners.
      - name: Run the Firefox turn-off test
        run: npm run test:firefox

      - name: Upload Playwright report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  required-gate:
    name: Lint, test, and package
    needs: [classify, repository-checks, browser-smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Passes only when the repository checks passed, the classification
      # gave a valid decision, and the browser tests passed or were skipped
      # because the base commit's policy allowed it.
      - name: Require every applicable check
        id: gate
        shell: bash
        env:
          BROWSER_REQUIRED: ${{ needs.classify.outputs.browser }}
          BROWSER_RESULT: ${{ needs.browser-smoke.result }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          POLICY: ${{ needs.classify.outputs.policy }}
          REPOSITORY_RESULT: ${{ needs.repository-checks.result }}
        run: |
          set -euo pipefail

          fail() {
            echo "::error::$1"
            exit 1
          }

          [[ "$CLASSIFY_RESULT" == success ]] || fail "Classifying the changes ended as '$CLASSIFY_RESULT'."
          [[ "$REPOSITORY_RESULT" == success ]] || fail "The repository checks ended as '$REPOSITORY_RESULT'."

          case "$POLICY" in
            base | none | manual) ;;
            *) fail "The classification gave no valid policy ('$POLICY')." ;;
          esac

          case "$BROWSER_REQUIRED" in
            true)
              [[ "$BROWSER_RESULT" == success ]] || fail "The browser smoke tests ended as '$BROWSER_RESULT'."
              ;;
            false)
              [[ "$POLICY" == base ]] || fail "Only the base commit's policy can skip the browser smoke tests."
              [[ "$BROWSER_RESULT" == skipped ]] || fail "The browser smoke tests ended as '$BROWSER_RESULT' but weren't required."
              ;;
            *) fail "The classification gave no valid browser decision ('$BROWSER_REQUIRED')." ;;
          esac

          echo "Repository checks passed; browser smoke tests: $BROWSER_RESULT (policy: $POLICY)."
