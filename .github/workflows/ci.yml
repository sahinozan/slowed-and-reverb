name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test, and package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install the pinned npm version
        run: npm install --global npm@11.19.0

      - name: Verify tool versions
        run: |
          node --version
          npm --version

      - name: Install exact dependencies
        run: npm ci

      - name: Run all checks
        run: npm run check

  browser-smoke:
    name: Browser smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install the pinned npm version
        run: npm install --global npm@11.19.0

      - name: Install exact dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps --no-shell chromium

      - name: Run extension browser smoke tests
        run: npm run test:e2e

      - name: Upload Playwright report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
