name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full: ${{ steps.changes.outputs.full }}
      browser: ${{ steps.changes.outputs.browser }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0

      - name: Classify changed paths
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "browser=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            range="$BASE_SHA...$HEAD_SHA"
          elif git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            range="$BEFORE_SHA..$HEAD_SHA"
          else
            range="$HEAD_SHA^..$HEAD_SHA"
          fi

          git diff --check "$range"
          git diff --name-only -z "$range" |
            node scripts/classify-ci-changes.js >> "$GITHUB_OUTPUT"

  repository-checks:
    name: Repository checks
    needs: classify
    if: needs.classify.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install the pinned npm version
        run: npm install --global npm@11.19.0

      - name: Verify tool versions
        run: |
          node --version
          npm --version

      - name: Install exact dependencies
        run: npm ci

      - name: Run all checks
        run: npm run check

  browser-smoke:
    name: Browser smoke (${{ matrix.os }})
    needs: classify
    if: needs.classify.outputs.browser == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm

      - name: Install the pinned npm version
        run: npm install --global npm@11.19.0

      - name: Install exact dependencies
        run: npm ci

      # Unpacking Chromium takes minutes on Windows, so keep the download in
      # a cache keyed on the Playwright version; a bump downloads it again.
      - name: Read the Playwright version
        id: playwright
        shell: bash
        run: |
          version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Restore Playwright Chromium
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\ms-playwright' || '~/.cache/ms-playwright' }}
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps --no-shell chromium

      # The cache holds only the browser, so Linux still needs its libraries.
      - name: Install Chromium's system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true' && runner.os == 'Linux'
        run: npx playwright install-deps chromium

      - name: Run extension browser smoke tests
        run: npm run test:e2e

      # Uses the Firefox already installed on GitHub's runners.
      - name: Run the Firefox turn-off test
        run: npm run test:firefox

      - name: Upload Playwright report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-${{ matrix.os }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14

  required-gate:
    name: Lint, test, and package
    needs: [classify, repository-checks, browser-smoke]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every applicable check
        shell: bash
        env:
          BROWSER_REQUIRED: ${{ needs.classify.outputs.browser }}
          BROWSER_RESULT: ${{ needs.browser-smoke.result }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          FULL_REQUIRED: ${{ needs.classify.outputs.full }}
          FULL_RESULT: ${{ needs.repository-checks.result }}
        run: |
          set -euo pipefail

          [[ "$CLASSIFY_RESULT" == "success" ]]

          if [[ "$FULL_REQUIRED" == "true" ]]; then
            [[ "$FULL_RESULT" == "success" ]]
          else
            [[ "$FULL_RESULT" == "skipped" ]]
          fi

          if [[ "$BROWSER_REQUIRED" == "true" ]]; then
            [[ "$BROWSER_RESULT" == "success" ]]
          else
            [[ "$BROWSER_RESULT" == "skipped" ]]
          fi
