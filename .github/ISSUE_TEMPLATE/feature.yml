name: Idea or request
description: Suggest a new effect, a change to how something works, or support for something new.
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: Describe the change as you'd use it.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it would help
      description: What you're trying to do, and what gets in the way today.
    validations:
      required: true
  - type: dropdown
    id: site
    attributes:
      label: Where it applies
      multiple: true
      options:
        - YouTube
        - YouTube Music
        - Spotify web player
        - The popup
        - The website
